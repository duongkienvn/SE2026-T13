    <title>Kanvexa · Collaborative Kanban boards</title>
    <!--
      Theme boot (see src/features/settings/theme.ts): paint in the cached theme
      only when it belongs to the signed-in user (token subject); otherwise follow
      the OS. ThemeSync takes over once the app has loaded.
    -->
    <script id="theme-boot">
      (function () {
        var theme = 'system';
        try {
          var session = JSON.parse(
            localStorage.getItem('kanban.session') || 'null',
          );
          var cached = JSON.parse(
            localStorage.getItem('kanvexa.theme') || 'null',
          );
          if (
            session &&
            typeof session.accessToken === 'string' &&
            typeof session.expiresAt === 'number' &&
            Number.isFinite(session.expiresAt) &&
            session.expiresAt > Date.now() &&
            cached &&
            /^(light|dark|system)$/.test(cached.theme)
          ) {
            var payload = session.accessToken
              .split('.')[1]
              .replace(/-/g, '+')
              .replace(/_/g, '/');
            if (JSON.parse(atob(payload)).sub === cached.userId)
              theme = cached.theme;
          }
        } catch (error) {
          theme = 'system';
        }
        if (theme === 'system')
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
